version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/docker/mysql"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/docker/postgres"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/docker/sqlite"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
